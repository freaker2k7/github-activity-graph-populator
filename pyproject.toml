[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "github-activity-graph-populator"
version = "1.0.0"
description = "A fun tool to populate GitHub activity graph the way you like or make it look super busy :)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Evgeny Kolyakov", email = "thenetfreaker@gmail.com" }
]

[project.urls]
Homepage = "https://github.com/freaker2k7/github-activity-graph-populator"
Repository = "https://github.com/freaker2k7/github-activity-graph-populator"
Documentation = "https://github.com/freaker2k7/github-activity-graph-populator/blob/master/README.md"
"Bug Tracker" = "https://github.com/freaker2k7/github-activity-graph-populator/issues"

[project.scripts]
gagp = "github_activity_graph_populator.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]