<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>GAGP Tile Builder</title>
	<link rel="icon" type="image/x-icon"
		href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAACpkAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABEREREREQABEREREREREBEREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREREQEREREREREQABEREREREQDAAwAAgAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIABAADAAwAA">

	<style>
		html,
		body {
			height: 100%;
			margin: 0;
			font-family: Arial, sans-serif;
			padding: 20px 0
		}

		#form {
			max-width: 90%;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 10px;
			margin: 0 auto;
		}

		#form input {
			width: 350px;
			max-width: 100%;
			padding: 8px;
			box-sizing: border-box;
		}

		#form div {
			width: 350px;
			max-width: 100%;
			box-sizing: border-box;
			display: flex;
			gap: 10px;
		}

		#form div button {
			width: 50%;
			padding: 8px 12px;
			border: 1px solid #ccc;
			border-radius: 4px;
			background-color: #f9f9f9;
			cursor: pointer;
		}

		#canvas {
			margin: 20px 0 0 0;
			cursor: pointer;
			max-width: 100%;
		}

		small {
			display: block;
			margin-bottom: 20px;
			color: #666;
			font-size: 12px;
			font-style: italic;
		}

		#tile-code {
			display: flex;
			align-items: center;
			justify-content: center;
		}

		#tile-code pre {
			padding: 10px;
			border: 1px solid #ddd;
			border-radius: 4px;
		}

		pre.shiki,
		pre.astro-code,
		code {
			min-width: 320px;
			max-width: 100%;
			white-space: pre-wrap !important;
			word-wrap: break-word !important;
			overflow-x: auto;
		}

		@media screen and (max-width: 600px) {

			#tile-code pre,
			pre.shiki,
			pre.astro-code,
			code {
				max-width: 280px;
			}
		}
	</style>
</head>

<body>
	<div id="root">
		<form action="#" id="form">
			<input type="text" id="tile-name" name="tile-name" required placeholder="Tile Name">
			<div>
				<button type="button" id="add-column">+ Add Column</button>
				<button type="button" id="remove-column">– Del Column</button>
			</div>
			<canvas id="canvas"></canvas>
			<small>Click on me</small>
		</form>

		<div id="tile-code"></div>
	</div>

	<script type="module">
		import { codeToHtml } from 'https://esm.sh/shiki@3.0.0';
		import { transformerCopyButton } from 'https://esm.sh/@selemondev/shiki-transformer-copy-button@1.1.0';

		const colors = ['#ffffff', '#00cc00', '#009900', '#006600', '#003300'];
		const gridRows = 7;
		let gridCols = 7;
		let minGridCols = 1;
		const size = 50;
		const height = size * gridRows;
		let width = size * gridCols;

		const canvas = document.getElementById('canvas');
		const ctx = canvas.getContext('2d');

		canvas.width = width;
		canvas.height = height;
		canvas.style.border = '1px solid black';
		canvas.style.borderRadius = '8px';
		canvas.style.borderRadius = '8px';
		canvas.style.boxShadow = '0 4px 8px rgba(0, 0, 0, 0.1)';
		ctx.fillStyle = 'lightgray';
		ctx.fillRect(0, 0, canvas.width, canvas.height);

		const grid = Array.from({ length: gridRows }, () => Array.from({ length: gridCols }, () => 0));
		const code = document.getElementById('tile-code');

		async function encode() {
			const name = document.getElementById('tile-name').value;

			code.innerHTML = await codeToHtml(`# ./src/github_activity_graph_populator/templates/${name || '<tile-name>'}.py
matrix="""
${grid.map(row => row.join("")).join("\n")}
"""
`, {
				lang: 'py',
				theme: 'everforest-light',
				transformers: [transformerCopyButton({
					duration: 1500,
					display: 'ready',
					successIcon: `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' stroke='rgba(128,128,128,1)' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24'%3E%3Crect width='8' height='4' x='8' y='2' rx='1' ry='1'/%3E%3Cpath d='M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2'/%3E%3Cpath d='m9 14 2 2 4-4'/%3E%3C/svg%3E`,
					copyIcon: `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' stroke='rgba(128,128,128,1)' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24'%3E%3Crect width='8' height='4' x='8' y='2' rx='1' ry='1'/%3E%3Cpath d='M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2'/%3E%3C/svg%3E`,
				})]
			});
		}

		canvas.addEventListener('click', (e) => {
			const rect = canvas.getBoundingClientRect();
			const x = e.clientX - rect.left;
			const y = e.clientY - rect.top;
			const col = Math.floor(x / (canvas.width / gridCols));
			const row = Math.floor(y / (canvas.height / gridRows));
			console.log(`Clicked on row ${row}, col ${col}`);
			grid[row][col] = (grid[row][col] + 1) % colors.length;
			drawGrid();
		});

		async function drawGrid() {
			const cellWidth = canvas.width / gridCols;
			const cellHeight = canvas.height / gridRows;
			for (let row = 0; row < gridRows; row++) {
				for (let col = 0; col < gridCols; col++) {
					ctx.fillStyle = colors[grid[row][col]];
					ctx.fillRect(col * cellWidth, row * cellHeight, cellWidth, cellHeight);
				}
			}

			await encode();
		}

		drawGrid();

		document.getElementById('form').addEventListener('submit', async (e) => {
			e.preventDefault();
			await encode();
		});

		document.getElementById('tile-name').addEventListener('input', async (e) => {
			e.preventDefault();
			await encode();
		});

		document.getElementById('add-column').addEventListener('click', async () => {
			gridCols++;
			for (let row = 0; row < gridRows; row++) {
				grid[row].push(0);
			}
			width = size * gridCols;
			canvas.width = width;
			await drawGrid();
		});

		document.getElementById('remove-column').addEventListener('click', async () => {
			if (gridCols > minGridCols) {
				gridCols--;
				for (let row = 0; row < gridRows; row++) {
					grid[row].pop();
				}
				width = size * gridCols;
				canvas.width = width;
				await drawGrid();
			}
		});

		window.addEventListener('resize', () => {
			canvas.style.width = Math.min(window.innerWidth * 0.9, width) + 'px';
			canvas.style.height = Math.min(window.innerHeight * 0.9, height) + 'px';
		});
	</script>
</body>

</html>
